[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/startup-manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Only content-addressed media is immutable; HTML and legacy media URLs stay fresh.
[[headers]]
  for = "/projects/cached/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
